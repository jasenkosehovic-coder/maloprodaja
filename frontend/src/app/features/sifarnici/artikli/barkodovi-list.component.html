<div class="page-container">
  <div class="page-header">
    <h2>Barkodovi</h2>
    <p class="subtitle">Upravljanje barkodovima artikala po poslovnicama</p>
  </div>

  <mat-progress-bar *ngIf="isLoading" mode="indeterminate" aria-label="Učitavanje barkodova"></mat-progress-bar>

  <app-crud-table
    [headers]="tableHeaders"
    [data]="items"
    [fields]="fields"
    [actions]="tableActions"
    [externalSave]="true"
    [externalDelete]="true"
    [idField]="'id'"
    [saving]="isSaving"
    [pdfHeader]="pdfHeader()"
    exportName="Barkodovi"
    (add)="onCreate($event)"
    (edit)="onUpdate($event)"
    (delete)="onDeactivate($event)"
    (deleteMany)="onDeactivateMany($event)">
  </app-crud-table>
</div>
