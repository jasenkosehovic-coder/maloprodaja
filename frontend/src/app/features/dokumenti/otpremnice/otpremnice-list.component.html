<div class="page-container">
  <app-page-header title="Otpremnice" subtitle="Pregled otpremnica" icon="local_shipping" />

  <app-crud-table
    [data]="otpremnice()"
    [headers]="['broj', 'datum', 'status', 'nazivPoslovnicePosiljaoca', 'nazivPoslovnicePrimaoca', 'brojStavki']"
    [fields]="fields"
    [actions]="actions"
    [filterableColumns]="filterableColumns"
    [externalAdd]="true"
    [externalEdit]="true"
    [rowStyleClass]="rowStyleClass"
    exportName="Otpremnice"
    (addClick)="onAddClick()"
    (editClick)="onEditClick($event)"
  />
</div>
