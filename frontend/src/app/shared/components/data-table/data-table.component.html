@if (isLoading()) {
  <mat-progress-bar mode="indeterminate" aria-label="Učitavanje podataka"></mat-progress-bar>
}

<div class="table-container" [attr.aria-busy]="isLoading()">
  <table
    mat-table
    [dataSource]="data()"
    matSort
    (matSortChange)="sortChange.emit($event)"
    [attr.aria-label]="ariaLabel()"
  >
    @for (col of columns(); track col.key) {
      <ng-container [matColumnDef]="col.key">
        <th
          mat-header-cell
          *matHeaderCellDef
          [mat-sort-header]="col.sortable ? col.key : ''"
          [disabled]="!col.sortable"
          [style.width]="col.width"
          [style.text-align]="col.align ?? 'left'"
        >
          {{ col.label }}
        </th>
        <td
          mat-cell
          *matCellDef="let row"
          [style.text-align]="col.align ?? 'left'"
        >
          {{ row[col.key] }}
        </td>
      </ng-container>
    }

    @if (showActions()) {
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header">Akcije</th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          <button
            mat-icon-button
            (click)="editClick.emit(row)"
            matTooltip="Uredi"
            aria-label="Uredi zapis"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            (click)="deleteClick.emit(row)"
            matTooltip="Obriši"
            aria-label="Obriši zapis"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns();"></tr>

    <tr class="mat-row no-data-row" *matNoDataRow>
      <td [attr.colspan]="displayedColumns().length" class="no-data-cell">
        @if (!isLoading()) {
          <div class="empty-state">
            <mat-icon>search_off</mat-icon>
            <span>Nema podataka za prikaz.</span>
          </div>
        }
      </td>
    </tr>
  </table>

  <mat-paginator
    [length]="totalElements()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="pageSizeOptions()"
    (page)="pageChange.emit($event)"
    aria-label="Navigacija stranicama"
    showFirstLastButtons
  ></mat-paginator>
</div>
