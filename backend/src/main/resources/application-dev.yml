spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/maloprodaja_dev
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

logging:
  level:
    ba.maloprodaja: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

app:
  cors:
    allowed-origins: http://localhost:4200

springdoc:
  swagger-ui:
    enabled: true
