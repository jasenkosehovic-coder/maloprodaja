spring:
  application:
    name: maloprodaja-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maloprodaja}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  websocket:
    message-size-limit: 65536
    send-buffer-size-limit: 524288

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:changeme-minimum-32-characters-long-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
    inactivity-timeout-ms: ${JWT_INACTIVITY_MS:3600000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  export:
    temp-dir: ${EXPORT_TEMP_DIR:${java.io.tmpdir}/maloprodaja}

  fiskalizacija:
    timeout-ms: ${FISKALIZACIJA_TIMEOUT_MS:10000}

  upload:
    slike-putanja: ${UPLOAD_SLIKE_PUTANJA:${java.io.tmpdir}/maloprodaja/slike}
    max-velicina-mb: ${UPLOAD_MAX_VELICINA_MB:5}

logging:
  level:
    ba.maloprodaja: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
