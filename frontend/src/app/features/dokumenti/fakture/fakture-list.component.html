<div class="page-container">
  <app-page-header title="Ulazne fakture" subtitle="Pregled ulaznih faktura" icon="receipt_long" />

  <!-- Filter bar -->
  <div class="filter-bar">
    <mat-form-field appearance="outline" class="filter-godina">
      <mat-label>Godina</mat-label>
      <mat-select
        [value]="odabranaGodina()"
        (selectionChange)="onGodinaChange($event.value)"
        aria-label="Odaberi godinu"
      >
        @for (opcija of opcijePodine(); track opcija.value) {
          <mat-option [value]="opcija.value">{{ opcija.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-date">
      <mat-label>Datum od</mat-label>
      <input
        matInput
        [matDatepicker]="odPicker"
        [value]="filterOd()"
        (dateChange)="onOdChange($event.value)"
        aria-label="Datum od"
        readonly
      />
      <mat-datepicker-toggle matIconSuffix [for]="odPicker" aria-label="Otvori kalendar za datum od"></mat-datepicker-toggle>
      <mat-datepicker #odPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-date">
      <mat-label>Datum do</mat-label>
      <input
        matInput
        [matDatepicker]="doPicker"
        [value]="filterDo()"
        (dateChange)="filterDo.set($event.value)"
        [min]="filterOd()"
        aria-label="Datum do"
        readonly
      />
      <mat-datepicker-toggle matIconSuffix [for]="doPicker" aria-label="Otvori kalendar za datum do"></mat-datepicker-toggle>
      <mat-datepicker #doPicker></mat-datepicker>
    </mat-form-field>

    <button mat-stroked-button type="button" (click)="resetFilters()" aria-label="Poništi filtere">
      <mat-icon>clear</mat-icon>
      Poništi
    </button>
  </div>

  <app-crud-table
    [data]="filtriraneFakture()"
    [headers]="['id', 'broj', 'datum', 'datumValute', 'nazivDobavljaca', 'statusFakture', 'ukupnoBezPdv', 'ukupno']"
    [fields]="fields"
    [actions]="actions"
    [filterableColumns]="filterableColumns"
    [externalAdd]="true"
    [externalEdit]="true"
    [externalDelete]="true"
    [rowStyleClass]="rowStyleClass"
    exportName="Ulazne fakture"
    [pdfHeader]="pdfHeader()"
    (addClick)="onAddClick()"
    (editClick)="onEditClick($event)"
    (delete)="onDelete($event)"
  />
</div>
